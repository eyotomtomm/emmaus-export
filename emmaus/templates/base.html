{% load static i18n %}
<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}" {% block html_attribute %}{% endblock html_attribute %}>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock title %}</title>
  <!-- fav icon -->
  <link rel="shortcut icon" {% block logo %}{% endblock %}>

  {% block css %}

  <!-- css file -->
  <link rel="stylesheet" href="{% static '/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static '/css/all.css' %}">
  <link rel="stylesheet" href="{% static '/css/magnific-popup.css' %}">
  <link rel="stylesheet" href="{% static '/css/slick.css' %}">
  <link rel="stylesheet" href="{% static '/css/slick-theme.css' %}">
  <link rel="stylesheet" href="{% static '/css/nice-select.css' %}">
  <link rel="stylesheet" href="{% static '/css/typography.css' %}">
  <link rel="stylesheet" href="{% static '/css/aos.css' %}">
  <link rel="stylesheet" href="{% static '/css/style.css' %}">
  <link rel="stylesheet" href="{% static '/css/responsive.css' %}">
  <link rel="stylesheet" href="{% static '/css/emmaus.css' %}">

  {% endblock css %}

</head>

<body {% block body_attribute %}{% endblock body_attribute %}>

  {% block content %}{% endblock content %}

  {% block javascript %}

  <!-- js file -->
  <script src="{% static '/js/jquery-3.7.1.min.js' %}"></script>
  <script src="{% static '/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static '/js/jquery.magnific-popup.min.js' %}"></script>
  <script src="{% static '/js/jquery.counterup.min.js' %}"></script>
  <script src="{% static '/js/slick.min.js' %}"></script>
  <script src="{% static '/js/jquery.nice-select.js' %}"></script>
  <script src="{% static '/js/waypoints.min.js' %}"></script>
  <script src="{% static '/js/aos.js' %}"></script>
  <script src="{% static '/js/main.js' %}"></script>

  {% endblock javascript %}

</body>

</html>
